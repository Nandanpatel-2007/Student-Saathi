<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Student Saathi | Attendance and academic performance tracker</title>
    <meta
      name="description"
      content="Student Saathi brings attendance, marks and subject-wise performance together for students and faculty, with clear charts and early alerts."
    />
    <meta name="theme-color" content="#fbfbfa" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233730a3'/%3E%3Crect x='7' y='17' width='4.5' height='8' rx='1' fill='%23fff'/%3E%3Crect x='13.75' y='12' width='4.5' height='13' rx='1' fill='%23fff'/%3E%3Crect x='20.5' y='7' width='4.5' height='18' rx='1' fill='%23fff'/%3E%3C/svg%3E"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply a saved theme before first paint to avoid a flash. -->
    <script>
      ;(function () {
        var root = document.documentElement
        try {
          var saved = localStorage.getItem('ss-theme')
          if (saved === 'light' || saved === 'dark') root.setAttribute('data-theme', saved)
        } catch (e) {}
        var theme =
          root.getAttribute('data-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0e0e13' : '#fbfbfa')
      })()
    </script>
    <noscript>
      <style>
        [data-reveal] {
          opacity: 1 !important;
          transform: none !important;
        }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
